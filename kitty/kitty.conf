# ================================================
# kitty.conf - slightly blurred, futuristic "yami hospital" look
# Save as ~/.config/kitty/kitty.conf
# Reload with: ctrl+shift+F5
# ================================================

# ---------- FONT ----------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures never

# ---------- TRANSPARENCY + BLUR ----------
# opacity: 1.0 = solid, lower = more see-through
background_opacity         0.80
dynamic_background_opacity yes

# background_blur only works on macOS and KDE. On Hyprland the blur
# is done by the compositor (decoration blur), which only shows
# through when the opacity above is below 1.
background_blur 24

# ---------- WINDOW ----------
window_padding_width     12
hide_window_decorations  yes
confirm_os_window_close  0
draw_minimal_borders     yes
window_border_width      1px
active_border_color      #a8ffe0
inactive_border_color    #2a3a52

# ---------- CURSOR ----------
cursor_shape          beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.6
cursor                #ff8fb8
cursor_text_color     #0c1824
# smooth glowing trail behind the cursor (kitty 0.37+, ignored if older)
cursor_trail          3
cursor_trail_decay    0.1 0.4

# ---------- BEHAVIOR ----------
scrollback_lines   10000
enable_audio_bell  no
copy_on_select     clipboard
mouse_hide_wait    2.0
url_color          #a8ffe0
url_style          curly

# ---------- TAB BAR ----------
tab_bar_edge             top
tab_bar_style            powerline
tab_powerline_style      round
tab_bar_min_tabs         2
tab_title_template       " {index}: {title} "
active_tab_foreground    #1c0d1c
active_tab_background    #ff8fb8
active_tab_font_style    bold
inactive_tab_foreground  #8fc4cc
inactive_tab_background  #1a2540
tab_bar_background       #0c1824

# ---------- COLORS ----------
foreground            #e6fff6
background            #0c1824
selection_foreground  #e6fff6
selection_background  #2f4a78

# black
color0   #14202c
color8   #3a4a5c
# red / pink
color1   #ff6b8f
color9   #ff8fb8
# green / mint
color2   #7fe8b8
color10  #a8ffe0
# yellow
color3   #ffe08a
color11  #fff0b8
# blue
color4   #7fa8ff
color12  #a8c4ff
# magenta / lavender
color5   #c9a7ff
color13  #deccff
# cyan
color6   #6fe0e0
color14  #a8f4f4
# white
color7   #cfe8e2
color15  #ffffff